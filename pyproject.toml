[project]
name = "lanbridge"
version = "0.1.0"
description = "Lightweight L2 virtual LAN bridge: keep static IPs across sites"
requires-python = ">=3.9"
dependencies = [
  # Only needed below Python 3.11; install.sh pulls python3-tomli there.
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
lanbridge = "lanbridge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lanbridge*"]

[tool.setuptools.package-data]
lanbridge = ["dashboard/static/*"]
